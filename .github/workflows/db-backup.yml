# Backup nocturno de la base Neon.
#
# Configurar en GitHub → Settings → Secrets and variables → Actions → Secrets
# (NO en Variables — ahí secrets.DATABASE_URL queda vacío):
#
#   DATABASE_URL = URL completa de Neon, con usuario:contraseña@host
#   postgresql://USER:PASSWORD@ep-xxx.us-east-1.aws.neon.tech/neondb?sslmode=require

name: DB Backup Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "=== Backup workflow v4 (usa secret DATABASE_URL) — commit ${{ github.sha }} ==="

          python3 <<'PY'
          import os
          import sys
          import urllib.parse
          from pathlib import Path

          def fail(msg: str) -> None:
              print(f"::error::{msg}")
              sys.exit(1)

          database_url = (os.environ.get("DATABASE_URL") or "").strip()
          if not database_url:
              fail(
                  "Secret DATABASE_URL vacío. "
                  "Configuralo en Settings → Secrets and variables → Actions → Secrets "
                  "(pestaña Secrets, NO Variables). "
                  "Pegá la URL completa: postgresql://usuario:contraseña@host/neondb?sslmode=require"
              )

          parsed = urllib.parse.urlparse(database_url)
          if parsed.scheme not in ("postgresql", "postgres"):
              fail("DATABASE_URL debe empezar con postgresql://")
          if not parsed.hostname:
              fail("DATABASE_URL no incluye host.")
          if not parsed.username:
              fail("DATABASE_URL no incluye usuario.")
          if not parsed.password:
              fail(
                  "DATABASE_URL no incluye contraseña (falta usuario:contraseña@host). "
                  "Actualizá el secret con la URL completa copiada desde Neon."
              )

          host = parsed.hostname.replace("-pooler", "")
          port = parsed.port or 5432
          user = urllib.parse.unquote(parsed.username)
          password = urllib.parse.unquote(parsed.password)
          database = urllib.parse.unquote((parsed.path or "").lstrip("/")) or "neondb"

          print(f"Host: {host}")
          print(f"Usuario: {user}")
          print(f"Base: {database}")
          print(f"Contraseña configurada: sí ({len(password)} caracteres)")

          pgpass = Path.home() / ".pgpass"
          # Escapar ':' y '\' según formato pgpass
          esc = lambda s: s.replace("\\", "\\\\").replace(":", "\\:")
          pgpass.write_text(
              f"{esc(host)}:{port}:{esc(database)}:{esc(user)}:{esc(password)}\n",
              encoding="utf-8",
          )
          pgpass.chmod(0o600)

          env_file = Path("/tmp/pg_backup.env")
          env_file.write_text(
              f"PGHOST={host}\nPGPORT={port}\nPGUSER={user}\nPGDATABASE={database}\nPGSSLMODE=require\n",
              encoding="utf-8",
          )
          print("Credenciales listas (~/.pgpass + variables de conexión).")
          PY

          set -a
          # shellcheck disable=SC1091
          source /tmp/pg_backup.env
          set +a

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="backup_${TIMESTAMP}.sql"

          echo "Conectando a ${PGHOST}:${PGPORT} como ${PGUSER}, base ${PGDATABASE}..."
          pg_dump \
            --format=plain \
            --no-owner \
            --no-acl \
            --file="${FILENAME}"

          gzip "${FILENAME}"
          ls -lh "${FILENAME}.gz"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: "*.sql.gz"
          retention-days: 90
